name: Pull cached Git LFS objects
description: Restores LFS objects from the Actions cache so each run does not spend LFS bandwidth.
runs:
  using: composite
  steps:
    - name: List LFS objects
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
    - uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
    - name: Pull LFS objects
      shell: bash
      run: git lfs pull && rm .lfs-assets-id
