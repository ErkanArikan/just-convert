name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "vendor/manifests/**"
      - "workers/**"
      - "scripts/fetch-engines.mjs"
      - "scripts/build-pdf-to-docx-worker.mjs"
      - "scripts/package-*.mjs"
      - "src-tauri/tauri*.conf.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach installers to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - id: version
        name: Check that the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for file in package.json; do
            test "$(node -p "require('./$file').version")" = "$version" || { echo "$file version differs from $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "Cargo.toml version differs from $version"; exit 1; }
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match app version v$version"; exit 1
          fi

  bundle:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: pnpm bundle:windows
            app: src-tauri/target/release/just-convert.exe
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: pnpm bundle:macos
            app: src-tauri/target/release/bundle/macos/Just Convert.app/Contents/MacOS/just-convert
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            bundle: pnpm bundle:macos
            app: src-tauri/target/release/bundle/macos/Just Convert.app/Contents/MacOS/just-convert
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-24.04
            bundle: pnpm bundle:linux
            app: src-tauri/target/release/just-convert
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: ubuntu-24.04-arm
            bundle: pnpm bundle:linux
            app: src-tauri/target/release/just-convert
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: ./.github/actions/checkout-lfs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-portable-ggml
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.12
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils libnss3 libfuse2
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/engine-archives
          key: engine-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/manifests/*.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:engines
        env:
          ENGINE_CACHE_DIR: ${{ runner.temp }}/engine-archives
      - name: Test every bundled engine
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path src-tauri/signing.conf.json -Value $config
      - name: Build installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -f src-tauri/signing.conf.json ]; then
            ${{ matrix.bundle }} --config src-tauri/signing.conf.json
          else
            ${{ matrix.bundle }}
          fi
      - name: Check that the app serves MCP with every engine ready
        run: node scripts/smoke-mcp.mjs "${{ matrix.app }}" --require-ready
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, bundle]
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      # Release Please drafts the release; it is published once every installer is attached.
      AUTO_PUBLISH: ${{ inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Package the MCP bundle
        run: node scripts/package-mcpb.mjs dist --server-json "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            [[ "$AUTO_PUBLISH" == true ]] && { echo "Release $RELEASE_TAG was expected to exist"; exit 1; }
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Just Convert ${{ needs.version.outputs.version }}" \
              --generate-notes
          fi
          if [[ "$AUTO_PUBLISH" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Publish to the MCP Registry
        if: env.AUTO_PUBLISH == 'true'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
