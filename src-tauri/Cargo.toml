[package]
name = "just-convert"
version = "0.1.0"
description = "A private, local-first file manager and converter"
authors = ["Erkan"]
edition = "2021"
default-run = "just-convert"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "just_convert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
printpdf = { version = "0.12.8", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["image_025", "pdfium_7881", "thread_safe"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
url = "2.5.8"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"], optional = true }
schemars = { version = "1", optional = true }
dirs = { version = "6", optional = true }
whisper-rs = "0.16.0"
ureq = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars", "dep:dirs"]

[[bin]]
name = "just-convert-mcp"
path = "src/bin/just-convert-mcp.rs"
required-features = ["mcp"]
